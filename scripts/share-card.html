<!doctype html>
<!--
  The picture shown when someone shares the site link (1200 x 630).
  To update it: run npm run dev, open http://localhost:5173/scripts/share-card.html
  in a 1200 x 630 window, then save a screenshot as public/og-image.jpg.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Share card</title>
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      html,
      body {
        margin: 0;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f7f3f0;
        font-family: 'Bricolage', sans-serif;
        color: #0f1015;
      }
      h1 {
        position: absolute;
        left: 60px;
        top: 70px;
        margin: 0;
        font-size: 150px;
        font-weight: 800;
        line-height: 0.82;
        letter-spacing: -0.05em;
        color: #c2325a;
      }
      p {
        position: absolute;
        left: 64px;
        bottom: 64px;
        margin: 0;
        width: 470px;
        font-size: 34px;
        font-weight: 650;
        line-height: 1.15;
      }
      .print {
        position: absolute;
        background: #fff;
        padding: 10px;
        box-shadow: 0 18px 40px rgba(15, 16, 21, 0.25);
      }
      .print img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Allyson<br />Layog</h1>
      <p>Creative designer and illustrator from the Philippines</p>
      <div class="print" style="left: 600px; top: 60px; width: 260px; rotate: -5deg">
        <img src="/images/work/bayani/portrait-headdress-small.webp" alt="" />
      </div>
      <div class="print" style="left: 870px; top: 30px; width: 230px; rotate: 4deg">
        <img src="/images/work/mistborn/kredik-shaw-small.webp" alt="" />
      </div>
      <div class="print" style="left: 760px; top: 330px; width: 300px; rotate: -2deg">
        <img src="/images/work/packaging/yema-balls-small.webp" alt="" />
      </div>
    </div>
  </body>
</html>
